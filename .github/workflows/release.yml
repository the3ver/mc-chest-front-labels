# GitHub Release mit JAR und Changelog-Auszug, ausgelöst durch einen Tag v* oder manuell für einen vorhandenen Tag
name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Vorhandener Tag, z. B. v0.1.2'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Mod
        run: chmod +x gradlew && ./gradlew build

      - name: Release notes
        run: pipx run git-cliff --current --strip header > notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" build/libs/chest-front-labels-*[0-9].jar --title "$TAG" --notes-file notes.md
