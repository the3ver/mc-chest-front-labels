# GitHub- und Modrinth-Release mit JAR und Changelog-Auszug, ausgelöst durch einen Tag v* oder manuell für einen vorhandenen Tag
name: Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Vorhandener Tag, z. B. v0.1.2'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - name: Checkout tag
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build Mod
        run: chmod +x gradlew && ./gradlew build

      - name: Release notes
        # Config immer von main, ältere Tags haben noch keine cliff.toml
        run: |
          git show origin/main:cliff.toml > cliff.toml
          pipx run git-cliff --current --strip header > notes.md
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1             || gh release create "$TAG" build/libs/chest-front-labels-*[0-9].jar --title "$TAG" --notes-file notes.md

      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@v3.3.2
        with:
          modrinth-id: iEgOJTb8
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          name: Chest Front Labels ${{ env.VERSION }}
          version: ${{ env.VERSION }}
          version-type: release
          changelog-file: notes.md
          files: build/libs/chest-front-labels-*[0-9].jar
          loaders: fabric
          game-versions: 26.3
          java: Java 25
          dependencies: fabric-api(required)
