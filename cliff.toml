# Changelog aus Conventional Commits. Neu erzeugen: uvx git-cliff -o CHANGELOG.md
# Versionen kommen aus Tags v*, gesetzt auf den Commit, der die Version in gradle.properties erhöht.

[changelog]
header = "# Changelog\n"
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}## Unveröffentlicht{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits -%}
- {{ commit.message | split(pat="\n") | first | trim }}
{% endfor %}{% endfor %}
"""
trim = false

[git]
conventional_commits = true
filter_unconventional = true
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Neu" },
  { message = "^fix", group = "<!-- 1 -->Behoben" },
  { message = ".*", skip = true },
]
filter_commits = true
tag_pattern = "v[0-9]*"
sort_commits = "oldest"
